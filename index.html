<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopwatch">
        <h1 id="displayTime">00.00.00</h1>
        <div class="button">
            <img src="stop.png.png" alt="stop">
            <img src="start.png.png" alt="start" onclick="watchStart()">
            <img src="reset.png.png" alt="reset">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
